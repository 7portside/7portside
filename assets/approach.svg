<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-labelledby="t d">
  <title id="t">Approach</title>
  <desc id="d">Paper editorial strip with four principles: local-first, observable, small surfaces, ship it.</desc>

  <rect width="1280" height="260" fill="#F5EFE4"/>
  <rect x="0" y="0" width="1280" height="8" fill="#17130D"/>

  <text x="64" y="52" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#6E6255">APPROACH / 03</text>
  <text x="1216" y="52" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4" fill="#6E6255">THE SHORT VERSION</text>

  <line x1="64" y1="96" x2="320" y2="96" stroke="#17130D" stroke-width="3"/>
  <text x="64" y="134" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="3" fill="#2233F0">01</text>
  <text x="64" y="182" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" font-weight="700" fill="#17130D">Local-first</text>
  <text x="64" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#6E6255">LOOPBACK OVER CLOUD</text>

  <line x1="352" y1="96" x2="608" y2="96" stroke="#17130D" stroke-width="3"/>
  <text x="352" y="134" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="3" fill="#2233F0">02</text>
  <text x="352" y="182" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" font-weight="700" fill="#17130D">Observable</text>
  <text x="352" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#6E6255">STATE ON THE SURFACE</text>

  <line x1="640" y1="96" x2="896" y2="96" stroke="#17130D" stroke-width="3"/>
  <text x="640" y="134" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="3" fill="#2233F0">03</text>
  <text x="640" y="182" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" font-weight="700" fill="#17130D">Small surfaces</text>
  <text x="640" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#6E6255">ONE JOB, FEW CONTROLS</text>

  <line x1="928" y1="96" x2="1184" y2="96" stroke="#2233F0" stroke-width="3"/>
  <text x="928" y="134" font-family="'Courier New', Courier, monospace" font-size="12" letter-spacing="3" fill="#2233F0">04</text>
  <text x="928" y="182" font-family="Georgia, 'Times New Roman', Times, serif" font-size="30" font-weight="700" fill="#2233F0">Ship it</text>
  <text x="928" y="214" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#6E6255">BUILD / PACKAGE / VERIFY</text>
</svg>
