<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-labelledby="title desc">
  <title id="title">Approach: local-first, observable, small surfaces, ship it</title>
  <desc id="desc">A black technical strip with four principles and short supporting lines.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#171717"/>
    </pattern>
  </defs>

  <rect width="1280" height="260" fill="#000000"/>
  <rect width="1280" height="260" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="258" fill="none" stroke="#2A2420" stroke-width="2"/>
  <rect x="0" y="0" width="1280" height="2" fill="#FFB96D"/>

  <text x="64" y="52" fill="#8F8175" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3">APPROACH / 03</text>
  <text x="1216" y="52" fill="#8F8175" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3" text-anchor="end">THE SHORT VERSION</text>

  <line x1="64" y1="108" x2="320" y2="108" stroke="#2A2420" stroke-width="1"/>
  <text x="64" y="144" fill="#FFB96D" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">01</text>
  <text x="64" y="184" fill="#CFC1B3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">LOCAL-FIRST</text>
  <text x="64" y="214" fill="#8F8175" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.5">LOOPBACK OVER CLOUD</text>

  <line x1="352" y1="108" x2="608" y2="108" stroke="#2A2420" stroke-width="1"/>
  <text x="352" y="144" fill="#FFB96D" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">02</text>
  <text x="352" y="184" fill="#CFC1B3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">OBSERVABLE</text>
  <text x="352" y="214" fill="#8F8175" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.5">STATE ON THE SURFACE</text>

  <line x1="640" y1="108" x2="896" y2="108" stroke="#2A2420" stroke-width="1"/>
  <text x="640" y="144" fill="#FFB96D" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">03</text>
  <text x="640" y="184" fill="#CFC1B3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">SMALL SURFACES</text>
