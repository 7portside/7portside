  <line x1="928" y1="108" x2="1184" y2="108" stroke="#2A2420" stroke-width="1"/>
  <text x="928" y="144" fill="#FFB96D" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2">04</text>
  <text x="928" y="184" fill="#FFB96D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">SHIP IT</text>
  <text x="928" y="214" fill="#8F8175" font-family="Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.5">BUILD / PACKAGE / VERIFY</text>
