  <rect x="1" y="1" width="1278" height="358" fill="none" stroke="#2A2420" stroke-width="2"/>
  <rect x="0" y="0" width="1280" height="2" fill="#FFB96D"/>

  <text x="64" y="58" fill="#8F8175" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3">7PORTSIDE / ENGINEERING</text>
  <text x="1216" y="58" fill="#8F8175" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3" text-anchor="end">FULL PATH / 2026</text>

  <text x="62" y="192" fill="#CFC1B3" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="800" letter-spacing="-5">7PORT<tspan fill="#FFB96D">SIDE</tspan></text>

  <text x="66" y="240" fill="#FFB96D" font-family="Consolas, 'Courier New', monospace" font-size="21" letter-spacing="2.5">FROM INTERFACE TO PIPELINE.</text>
