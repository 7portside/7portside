<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">7portside — frontend, backend, environment and CI/CD</title>
  <desc id="desc">A black editorial banner with bone type, orange accents and a patchbay routing diagram.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#171717"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="#000000"/>
